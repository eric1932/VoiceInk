# Fork-only: builds the ui-polish branch into a signed VoiceInk.app on every push (see .github/FORK_CI.md).
name: Build ui-polish

on:
  push:
    branches: [ui-polish]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner image (macos-26 = Xcode 26, GA; xcode-27 = Xcode 27, preview)
        type: choice
        options: [macos-26, xcode-27]
        default: macos-26
      xcode-version:
        description: Optional Xcode on that image, e.g. 26.6 or 27.2 (empty = image default)
        type: string
        default: ''

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: VoiceInk.app
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - id: build
        uses: ./.github/actions/build-voiceink
        with:
          certificate-p12-base64: ${{ secrets.APPLE_DEV_CERT_P12_BASE64 }}
          certificate-password: ${{ secrets.APPLE_DEV_CERT_PASSWORD }}
          xcode-version: ${{ inputs.xcode-version }}

      # Same name on every run, so `gh run download -n VoiceInk-ui-polish` always fetches the newest build.
      - uses: actions/upload-artifact@v7
        with:
          name: VoiceInk-ui-polish
          path: ${{ steps.build.outputs.dist-dir }}
          compression-level: 0
          if-no-files-found: error
